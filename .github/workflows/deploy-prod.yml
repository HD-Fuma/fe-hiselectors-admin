name: Deploy production

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: https://api.hiselectors.shop
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload production files
        run: |
          aws s3 sync dist/assets/ s3://hiselectors-deploy/admin/assets/ \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync dist/ s3://hiselectors-deploy/admin/ \
            --exclude 'index.html' \
            --exclude 'assets/*' \
            --cache-control 'no-cache'
          aws s3 cp deploy/nginx/admin-cache.conf \
            s3://hiselectors-deploy/admin/.deploy/nginx-admin-cache.conf \
            --cache-control 'no-store'
          aws s3 cp dist/index.html s3://hiselectors-deploy/admin/index.html \
            --cache-control 'no-cache, no-store, must-revalidate' \
            --content-type text/html

      - name: Deploy to Nginx through SSM
        env:
          REMOTE_SCRIPT: |
            set -eu
            mkdir -p /srv/admin
            aws s3 sync s3://hiselectors-deploy/admin/ /srv/admin/ --exclude 'index.html' --exclude '.deploy/*'
            aws s3 cp s3://hiselectors-deploy/admin/index.html /srv/admin/index.html

            CONFIG_PATH=/etc/nginx/conf.d/hiselectors-admin-cache.conf
            BACKUP_PATH=/etc/nginx/conf.d/hiselectors-admin-cache.conf.previous
            if [ -f "$CONFIG_PATH" ]; then
              cp "$CONFIG_PATH" "$BACKUP_PATH"
            else
              rm -f "$BACKUP_PATH"
            fi
            aws s3 cp s3://hiselectors-deploy/admin/.deploy/nginx-admin-cache.conf "$CONFIG_PATH"
            if ! nginx -t; then
              if [ -f "$BACKUP_PATH" ]; then
                mv "$BACKUP_PATH" "$CONFIG_PATH"
              else
                rm -f "$CONFIG_PATH"
              fi
              nginx -t
              exit 1
            fi
            rm -f "$BACKUP_PATH"
            nginx -s reload
        run: |
          test -n "$EC2_INSTANCE_ID"
          PARAMETERS="$(jq -cn \
            --arg command "$REMOTE_SCRIPT" \
            '{commands:[$command],executionTimeout:["600"]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"
          STATUS=
          for _ in {1..120}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
                exit 1
                ;;
            esac
            sleep 5
          done
          if [ "$STATUS" != "Success" ]; then
            aws ssm cancel-command --command-id "$COMMAND_ID" --instance-ids "$EC2_INSTANCE_ID"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" || true
            exit 1
          fi

      - name: Invalidate CloudFront
        run: |
          test -n "$CLOUDFRONT_DISTRIBUTION_ID"
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
